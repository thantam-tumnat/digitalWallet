spring.application.name=digitalWallet

# --- Database (PostgreSQL via Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/walletdb
spring.datasource.username=wallet
spring.datasource.password=wallet123

# --- JPA / Hibernate ---
# ddl-auto=update -> Hibernate สร้าง/อัปเดตตารางให้อัตโนมัติตาม Entity (ใช้เฉพาะ dev, prod ควรใช้ Flyway)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# secret ยาว >= 32 ตัวอักษร (256-bit) สำหรับ HS256; prod ต้องย้ายไป environment variable
app.jwt.secret=dev-secret-change-me-please-0123456789-abcdefghijklmnop
app.jwt.expiration-ms=86400000

